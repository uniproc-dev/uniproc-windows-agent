[package]
name = "uniproc-windows-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-service = "0.8.0"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "evntrace", "evntcons", "evntprov", "wmistr", "minwinbase", "timezoneapi",
    "winerror", "ntstatus", "minwindef", "winnt", "windef", "handleapi", "errhandlingapi",
    "processthreadsapi", "winbase", "securitybaseapi", "winternl", "ntddk", "memoryapi",
    "winsvc", "profileapi", "pdh", "powerbase", "sysinfoapi",
    "winver", "fileapi", "appmodel", "shellapi", "shlwapi",
    "mscat", "mssip", "wincrypt", "wintrust", "ntsecapi"] }
ntapi = "0.4.3"
fxhash = "0.2.1"

ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.6.0" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.9.0" }
capnp = "0.27"
capnp-rpc = "0.27"
dhat = "0.3.3"
clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["clock"] }

anyhow = "1"
ctrlc = "3"
binrw = "0.15.0"

amethystate = { version = "0.22", default-features = false, features = ["redb"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

parking_lot = "0.12"
crossbeam-channel = "0.5"

# The read-only state API: its own thread with a current-thread tokio runtime,
# beside the capnp side's compio. The two share only the state behind its lock.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net"] }
getrandom = "0.3"

roxmltree = "0.20"

dashmap = "6.1.0"
compio = "0.18.0"

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
debug = true
