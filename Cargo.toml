[workspace]
members = ["crates/core"]

[package]
name = "uniproc-windows-agent"
version = "0.1.0"
edition = "2024"

[features]
default = ["service"]
service = [
    "dep:windows-service", "dep:clap", "dep:dhat", "dep:ctrlc", "dep:tracing-subscriber",
    "dep:axum", "dep:tokio", "dep:serde", "dep:serde_json", "dep:getrandom",
]

[[bin]]
name = "uniproc-windows-agent"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
uniproc-windows-core = { path = "crates/core" }

windows-service = { version = "0.8.0", optional = true }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "winerror", "minwindef", "winnt", "windef", "handleapi", "errhandlingapi",
    "processthreadsapi", "winbase", "securitybaseapi", "winsvc"] }
ntapi = "0.4.3"

ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.6.3" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.9.0" }
capnp = "0.27"
capnp-rpc = "0.27"
dhat = { version = "0.3.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

anyhow = "1"
ctrlc = { version = "3", optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

parking_lot = "0.12"
crossbeam-channel = "0.5"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net"], optional = true }
getrandom = { version = "0.3", optional = true }

compio = { version = "0.18.0", features = ["time"] }
futures = "0.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
debug = true
