[package]
name = "uniproc-windows-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-service = "0.8.0"
windows = { version = "0.62.2", features = ["Win32_System_Diagnostics_Etw", "Win32_System_Threading", "Win32_Foundation", "Win32_System_EventLog", "Win32_Security", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Time"] }

ogurpchik = { git = "https://github.com/Tam1SH/oguRPChik", branch = "master" }
uniproc-protocol = { git = "https://github.com/Tam1SH/uniproc-protocol", branch = "master" }

clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["clock"] }

anyhow = "1"
ctrlc = "3"
binrw = "0.15.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4.29"
lazy_static = "1.5.0"
