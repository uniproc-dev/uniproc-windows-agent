[package]
name = "uniproc-windows-core"
version = "0.30.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
schemars = { version = "1.2.2", features = ["smol_str03"] }
serde_json = "1"
libloading = "0.8"
windows-core = "0.100"
winreg = "0.55"
uniproc-etw = { git = "https://github.com/uniproc-dev/uniproc-etw", tag = "v0.1.0" }
ntapi = "0.4.3"
rustc-hash = "2"
binrw = "0.15.0"
amethystate = { version = "0.29.0", default-features = false, features = ["redb"] }
serde = { version = "1", features = ["derive", "rc"] }
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
enumset = { version = "1.1", features = ["serde"] }
uniproc-agent-kit = { git = "https://github.com/uniproc-dev/uniproc-agent-kit", tag = "v0.3.0" }
roxmltree = "0.20"
smol_str = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
