[package]
name = "uniproc-windows-core"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
windows = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "evntrace", "evntcons", "evntprov", "wmistr", "minwinbase", "timezoneapi",
    "winerror", "ntstatus", "minwindef", "winnt", "windef", "handleapi", "errhandlingapi",
    "processthreadsapi", "winbase", "securitybaseapi", "winternl", "ntddk", "memoryapi",
    "profileapi", "pdh", "powerbase", "sysinfoapi",
    "winver", "fileapi", "appmodel", "shellapi", "shlwapi",
    "mscat", "mssip", "wincrypt", "wintrust", "ntsecapi", "winuser", "wow64apiset", "netioapi",
    "aclapi", "accctrl", "sddl", "ioapiset", "winioctl", "psapi", "libloaderapi"] }
ntapi = "0.4.3"
rustc-hash = "2"
binrw = "0.15.0"
amethystate = { version = "0.22", default-features = false, features = ["redb"] }
serde = { version = "1", features = ["derive", "rc"] }
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
enumset = "1.1"
uniproc-agent-kit = { git = "https://github.com/uniproc-dev/uniproc-agent-kit", tag = "v0.3.0" }
roxmltree = "0.20"
smol_str = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
