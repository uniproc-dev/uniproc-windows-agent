[package]
name = "uniproc-windows-rpc"
version = "0.20.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
uniproc-windows-agent = { path = "../.." }

ogurpchik = { git = "https://github.com/uniproc-dev/oguRPChik", tag = "v0.7.1" }
uniproc-protocol = { git = "https://github.com/uniproc-dev/uniproc-protocol", tag = "v0.18.0" }
futures = "0.3"
capnp = "0.27"
capnp-rpc = "0.27"
compio = { version = "0.18.0", features = ["time"] }
anyhow = "1"
tracing = "0.1"
