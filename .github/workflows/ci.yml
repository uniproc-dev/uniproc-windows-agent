name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels a stale run when new commits land on the same branch/PR - avoids
# burning CI minutes on a build for a diff that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    # Windows-only: the agent is Win32 top to bottom (ETW, SCM services,
    # WinTrust signature checks), it does not build anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same toolchain as rust-toolchain.toml: windows-rs needs 1.95.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.95.0"

      # `uniproc-protocol`'s build.rs runs `capnpc`, which shells out to the
      # `capnp` compiler binary. It is not on the runner image, so install it
      # before any cargo invocation.
      # Version pinned deliberately: an unpinned `choco install` follows
      # whatever is newest, so a green build could turn red without a single
      # commit having changed.
      - name: Install Cap'n Proto
        run: choco install capnproto --version=1.3.0 --no-progress -y

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Build as uniproc embeds it
        run: cargo check -p uniproc-windows-agent --lib --tests --examples

      # Tests that need admin rights and a live ETW session are `#[ignore]`d
      # and run in the next step.
      - name: Test
        run: cargo test --workspace

      # The restart test restarts UNIPROC_TEST_SERVICE, by default the
      # agent's own service, which the runner does not have. The runner is
      # thrown away afterwards, so the print spooler, a service in a process
      # of its own, stands in for it.
      - name: Start the service the restart test restarts
        shell: pwsh
        run: |
          Set-Service -Name Spooler -StartupType Manual
          Start-Service -Name Spooler
          Get-Service -Name Spooler

      - name: Test against live ETW
        env:
          UNIPROC_TEST_SERVICE: Spooler
        run: cargo test --workspace -- --ignored --test-threads=1
